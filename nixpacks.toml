[phases.setup]
nixPkgs = ['nodejs-18_x', 'npm-9_x']

[phases.install]
cmds = [
  'bash -lc "echo RAILWAY_BUILD_ID=$RAILWAY_BUILD_ID; pwd; ls -la; echo FRONTEND; ls -la frontend || true; echo BACKEND; ls -la backend || true"',
  'npm ci',
  'bash -lc "if [ -f frontend/package.json ]; then cd frontend && npm ci; else echo \"frontend not present, skipping npm ci\"; fi"',
  'cd backend && npm ci'
]

[phases.build]
cmds = [
  'bash -lc "echo BUILD START $(date); pwd; ls -la; echo FRONTEND; ls -la frontend || true; echo BACKEND; ls -la backend || true"',
  'bash -lc "if [ -f frontend/package.json ]; then npm --prefix frontend run build; else echo \"frontend not present, skipping build\"; fi"',
  'bash -lc "if [ -d frontend/build ]; then rm -rf backend/public && mkdir -p backend/public && cp -R frontend/build/* backend/public/; else echo \"no frontend/build, skipping copy\"; fi"',
  'cd backend && npx prisma generate && npm run build',
  'bash -lc "if [ -d backend/public ]; then cd backend && mkdir -p dist/public && cp -R public/* dist/public/; else echo \"no backend/public, skipping copy to dist\"; fi"'
]

[start]
cmd = 'cd backend && npx prisma generate && npx prisma migrate deploy && npm start'